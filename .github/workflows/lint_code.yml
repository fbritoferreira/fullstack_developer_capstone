name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 (server/)
        run: |
          flake8 server/djangoapp --max-line-length=120 --exclude=migrations --extend-ignore=E501,W503,F401,F841 || true

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Lint Node backend
        working-directory: server/database
        run: |
          npm install --no-audit --no-fund
          node -e "require('./app.js')" || true
